name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The sandbox is the security floor, so CI has to exercise it rather than
      # skip past it: without bubblewrap every test that needs a real boundary
      # skips, and a skipped boundary test reads as a passing one.
      - name: bubblewrap (linux)
        if: runner.os == 'Linux'
        # `apt-get update` já parou de responder no meio da lista de espelhos
        # três vezes, e sem prazo o job fica pendurado até alguém perceber e
        # cancelar — 25 minutos na pior delas. Espelho mudo é a falha mais
        # provável desta linha e a que menos diz sobre o código; o passo passa a
        # tentar de novo e, se ainda assim não vier, a reprovar depressa em vez
        # de segurar o PR inteiro.
        timeout-minutes: 8
        run: |
          # E o espelho morto é a causa, não o sintoma. O log de uma das
          # falhas mostra `Ign:` repetido para azure.archive.ubuntu.com antes
          # de cair para archive.ubuntu.com: o apt espera o timeout DELE, de
          # cerca de dois minutos por repositório, e o nosso acaba primeiro.
          # Dar mais tempo seria pagar a espera; desistir depressa é não
          # entrar nela.
          APT="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $APT update; then break; fi
            echo "apt-get update nao respondeu (tentativa $attempt de 3)"
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          sudo timeout 180 apt-get $APT install -y bubblewrap
          # Installing it was not enough, and the step above said it was for
          # months. Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor, so bwrap arrives, answers "Permission denied" on its first
          # namespace, and every test needing a real boundary skips — on the one
          # platform whose backend IS bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # And prove it, because a step that quietly fails to do what it says is
          # what put us here. This is the same probe the sandbox runs at startup.
          bwrap --ro-bind / / --dev /dev true
      # The same proof on the other platform, and for the same reason. Seatbelt
      # ships with macOS so nothing needs installing — but a runner that could
      # not apply a profile would skip every boundary test and report green,
      # which is precisely the silence this job exists to break.
      - name: seatbelt (macos)
        if: runner.os == 'macOS'
        run: sandbox-exec -p '(version 1)(allow default)' true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...
      # O gate não roda aqui. Cada plataforma mede só o que ela consegue
      # executar, e reprovar por um ramo que a outra cobre é reprovar por
      # geografia — ver o job `coverage`. O perfil é a saída deste job.
      #
      # `always()` porque um gate que reprova sem entregar o perfil obriga a
      # adivinhar a partir do log, e adivinhar num runner que não se tem em
      # mãos é caro.
      - name: perfil de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 7

  # O gate mede o programa, e o programa é as duas plataformas. A convenção de
  # testes já dizia isso — "coberto na matriz de CI da plataforma
  # correspondente" — sem que nada cumprisse: com o gate dentro do job da
  # matriz, um ramo só alcançável no macOS contava como descoberto no Ubuntu.
  # Reprovou três PRs numa noite, sempre assim.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # `go tool cover -func` lê o fonte para nomear as funções, por isso o
      # checkout e o toolchain acima.
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: perfis
      - name: união da matriz
        run: ./scripts/merge-coverage.sh perfis/*/coverage.out > coverage.out
      - run: ./scripts/coverage.sh coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: build sem cgo
        run: CGO_ENABLED=0 go build -trimpath ./...
      - name: nenhum cgo no nucleo
        run: |
          if grep -rn --include='*.go' '^import "C"' internal/ pkg/ cmd/ \
             | grep -v '_cgo\.go'; then
            echo "cgo fora do pacote isolado"; exit 1
          fi
