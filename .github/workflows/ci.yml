name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The sandbox is the security floor, so CI has to exercise it rather than
      # skip past it: without bubblewrap every test that needs a real boundary
      # skips, and a skipped boundary test reads as a passing one.
      - name: bubblewrap (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Installing it was not enough, and the step above said it was for
          # months. Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor, so bwrap arrives, answers "Permission denied" on its first
          # namespace, and every test needing a real boundary skips — on the one
          # platform whose backend IS bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # And prove it, because a step that quietly fails to do what it says is
          # what put us here. This is the same probe the sandbox runs at startup.
          bwrap --ro-bind / / --dev /dev true
      # The same proof on the other platform, and for the same reason. Seatbelt
      # ships with macOS so nothing needs installing — but a runner that could
      # not apply a profile would skip every boundary test and report green,
      # which is precisely the silence this job exists to break.
      - name: seatbelt (macos)
        if: runner.os == 'macOS'
        run: sandbox-exec -p '(version 1)(allow default)' true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...
      - run: ./scripts/coverage.sh coverage.out
      # Um gate que reprova sem entregar o perfil obriga a adivinhar a partir do
      # log, e adivinhar num runner que não se tem em mãos é caro.
      - name: perfil de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: build sem cgo
        run: CGO_ENABLED=0 go build -trimpath ./...
      - name: nenhum cgo no nucleo
        run: |
          if grep -rn --include='*.go' '^import "C"' internal/ pkg/ cmd/ \
             | grep -v '_cgo\.go'; then
            echo "cgo fora do pacote isolado"; exit 1
          fi
