name: release

# Triggered by a tag, with no manual step: a release that needs someone to
# remember something is a release that eventually ships unsigned.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Keyless signing takes an ephemeral OIDC identity, so there is no long-lived
  # private key anywhere — which would otherwise be the highest-value item in
  # the entire repository.
  id-token: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: bubblewrap (linux)
        if: runner.os == 'Linux'
        # `apt-get update` já parou de responder no meio da lista de espelhos
        # três vezes, e sem prazo o job fica pendurado até alguém perceber e
        # cancelar — 25 minutos na pior delas. Espelho mudo é a falha mais
        # provável desta linha e a que menos diz sobre o código; o passo passa a
        # tentar de novo e, se ainda assim não vier, a reprovar depressa em vez
        # de segurar o PR inteiro.
        timeout-minutes: 8
        run: |
          # O espelho morto é a causa, e o nome dele está no log: as imagens
          # do runner apontam para azure.archive.ubuntu.com através de
          # /etc/apt/apt-mirrors.txt, e é ele que emudece. Baixar o prazo do
          # apt não bastou — as três tentativas seguiram estourando os 120s
          # nossos, porque o problema não é ele desistir devagar, é ele estar
          # esperando um espelho que não responde.
          #
          # Nomear um que responde resolve na origem. archive.ubuntu.com é o
          # que o próprio log mostra atendendo, depois da espera.
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          APT="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $APT update; then break; fi
            echo "apt-get update nao respondeu (tentativa $attempt de 3)"
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          sudo timeout 180 apt-get $APT install -y bubblewrap
          # Installing it was not enough, and the step above said it was for
          # months. Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor, so bwrap arrives, answers "Permission denied" on its first
          # namespace, and every test needing a real boundary skips — on the one
          # platform whose backend IS bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # And prove it, because a step that quietly fails to do what it says is
          # what put us here. This is the same probe the sandbox runs at startup.
          bwrap --ro-bind / / --dev /dev true
      # The same proof on the other platform, and for the same reason. Seatbelt
      # ships with macOS so nothing needs installing — but a runner that could
      # not apply a profile would skip every boundary test and report green,
      # which is precisely the silence this job exists to break.
      - name: seatbelt (macos)
        if: runner.os == 'macOS'
        run: sandbox-exec -p '(version 1)(allow default)' true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...
      # O gate de cobertura NÃO roda aqui, e a ausência é deliberada.
      #
      # Ele mede a união dos perfis da matriz (#190), porque um ramo que só uma
      # plataforma executa contava como descoberto na outra. Rodá-lo de novo
      # aqui, por plataforma, é rodar exatamente a forma que reprovava por
      # geografia — e no pior momento, com a tag já criada.
      #
      # A união já foi medida: uma tag só existe sobre um commit da main, e
      # todo commit da main passou pelo job `coverage` da CI. Repetir a versão
      # quebrada da verificação não acrescenta garantia, só acrescenta uma
      # maneira de o release falhar sem que nada esteja errado.

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: sigstore/cosign-installer@v3

      - name: build every platform
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BARE="${VERSION#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(git log -1 --format=%cI)"
          LDFLAGS="-s -w \
            -X github.com/aguinelo/dcode/internal/version.Version=${BARE} \
            -X github.com/aguinelo/dcode/internal/version.Commit=${COMMIT} \
            -X github.com/aguinelo/dcode/internal/version.Date=${DATE} \
            -X github.com/aguinelo/dcode/internal/version.Source=release"

          mkdir -p dist
          # Exatamente as plataformas com backend de sandbox. Publicar um
          # binario que nao consegue criar sessao e pior que nao publicar.
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            out="dist/dcode"
            [ "$GOOS" = "windows" ] && out="dist/dcode.exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/dcode

            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -q "dcode_${BARE}_windows_${GOARCH}.zip" dcode.exe && rm dcode.exe)
            else
              (cd dist && tar -czf "dcode_${BARE}_${GOOS}_${GOARCH}.tar.gz" dcode && rm dcode)
            fi
          done

      - name: checksums
        run: cd dist && sha256sum dcode_* > checksums.txt && cat checksums.txt

      # The checksums file is what gets signed: one signature for the whole
      # release, while verification stays per-artifact through the hashes.
      - name: sign the checksums
        run: |
          cd dist
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: verify what we are about to publish
        run: |
          cd dist
          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity-regexp '^https://github.com/aguinelo/dcode/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt

      # Depois da verificacao, e nao antes: os digests que o instalador passa a
      # carregar tem de sair de um checksums.txt que ja foi assinado E conferido.
      # Fixar antes seria carregar digest que ninguem atestou — a falha que esta
      # funcionalidade existe para impedir, reproduzida dentro do pipeline que a
      # implementa.
      - name: pin the installer to this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/installer.sh "$VERSION" dist/checksums.txt install.sh
          cp install.sh dist/install.sh
          sed -n '/BEGIN PINNED/,/END PINNED/p' dist/install.sh

      # Derivada do checksums.txt que acabou de ser assinado, nunca escrita a
      # mao: o SHA-256 na formula e o do artefato assinado por construcao. Uma
      # formula com digest digitado passa em todo teste local, instala em todo
      # lugar, e um dia aponta para um binario que ninguem assinou.
      - name: generate the homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/formula.sh "$VERSION" dist/checksums.txt > dist/dcode.rb
          cat dist/dcode.rb

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*

      # Depois do release existir, pelo mesmo motivo do tap: falhar aqui nao
      # despublica nada, pinta de vermelho um release que deu certo. Toda falha
      # recuperavel sai com zero e avisa alto, e a decisao vive no script.
      #
      # A main precisa disto, e nao apenas o asset: a URL que o README publica e
      # `main/install.sh`, entao um pino so no release nunca alcanca quem
      # instala. E e onde mora o argumento de seguranca inteiro — asset de
      # release se troca sem rastro publico, linha de arquivo versionado nao.
      - name: carry the pinned installer to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-installer.sh "${GITHUB_REF_NAME#v}" dist/install.sh
